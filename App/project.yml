name: YinerFocus
options:
  bundleIdPrefix: com.yiner
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    # 换成银耳的 Apple Development Team ID。留空时，Xcode 打开后要在签名里选团队。
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    # 只做 Apple Silicon，和银耳的 MacBook Air 一致。
    ARCHS: arm64
packages:
  YinerFocusCore:
    path: ../Packages/YinerFocusCore
targets:
  YinerFocus:
    type: application
    platform: macOS
    sources:
      - path: YinerFocus
        excludes:
          - Info.plist
          - YinerFocus.entitlements
    dependencies:
      - package: YinerFocusCore
        product: YinerFocusCore
      - target: YinerWidget
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yiner.focus
        PRODUCT_NAME: YinerFocus
        INFOPLIST_FILE: YinerFocus/Info.plist
        CODE_SIGN_ENTITLEMENTS: YinerFocus/YinerFocus.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  YinerWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: YinerWidget
        excludes:
          - Info.plist
          - YinerWidget.entitlements
    dependencies:
      - package: YinerFocusCore
        product: YinerFocusCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yiner.focus.widget
        PRODUCT_NAME: YinerWidget
        INFOPLIST_FILE: YinerWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: YinerWidget/YinerWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
schemes:
  YinerFocus:
    build:
      targets:
        YinerFocus: all
    run:
      config: Debug
